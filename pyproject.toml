[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosl"
version = "1.0.0"
description = "The Department of Sandwich Legitimacy: an over-engineered sandwich authorization authority."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sandwich", "bureaucracy", "bytecode", "pe", "x86-64", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

# There are none. That is somewhat the point: the x86-64 assembler, the PE
# linker, the icon writer and the container format are all stdlib-only.
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pyinstaller>=6.0", "pytest>=7.0"]

[project.scripts]
dosl = "dosl.cli:main"

[project.gui-scripts]
dosl-counter = "dosl.ui.gui:run"

[tool.setuptools]
packages = [
    "dosl",
    "dosl.bureau",
    "dosl.forge",
    "dosl.formats",
    "dosl.kernel",
    "dosl.native",
    "dosl.policies",
    "dosl.ui",
]

[tool.setuptools.package-data]
"dosl.policies" = ["*.bureau"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
